# Prefix: Ctrl+\; pressing it twice returns to the last window.
unbind C-b
set -g prefix C-\\
bind C-\\ last-window
bind : command-prompt
bind S choose-tree -Zw
bind r command-prompt -I "#S" "rename-session -- '%%'"
bind R source-file ~/.tmux.conf \; display-message "Configuration reloaded"

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-kitty:RGB:extkeys"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g detach-on-destroy off
set -s extended-keys on
set -s extended-keys-format csi-u

bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind = select-layout tiled

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
setw -g window-status-separator ""
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string ""

set -g status-style "bg=#141415,fg=#cdcdcd"
set -g status-left "#[fg=#141415,bg=#6e94b2,bold] #S #[bg=#141415,nobold] "
set -g status-right "#[fg=#6e94b2]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#606079]#h "
setw -g window-status-format "#[fg=#606079] #I:#W "
setw -g window-status-current-format "#[fg=#6e94b2,bold] #I:#W "
setw -g window-status-activity-style "fg=#e8b589"
set -g pane-border-style "fg=#606079"
set -g pane-active-border-style "fg=#6e94b2"
set -g message-style "bg=#141415,fg=#6e94b2"
set -g message-command-style "bg=#141415,fg=#6e94b2"
setw -g mode-style "bg=#252530,fg=#cdcdcd"
setw -g clock-mode-colour "#6e94b2"
